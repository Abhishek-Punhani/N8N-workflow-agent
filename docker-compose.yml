name: data-intelligence
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai_platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-ai_data_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${DB_NAME:-ai_data_db}
      DB_POSTGRESDB_USER: ${DB_USER:-ai_platform}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'false'
      EXECUTIONS_TIMEOUT: '120'
      EXECUTIONS_DATA_MAX_AGE: '168'
      N8N_RUNNERS_ENABLED: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40

  n8n-bootstrapper:
    image: node:22-alpine
    environment:
      N8N_BASE_URL: http://n8n:5678
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?Set N8N_OWNER_EMAIL}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:?Set N8N_OWNER_PASSWORD}
    volumes:
      - ./scripts/bootstrap-n8n.mjs:/bootstrap.mjs:ro
      - shared_env:/shared
    command: [node, /bootstrap.mjs]
    depends_on:
      n8n:
        condition: service_healthy

  platform:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${PLATFORM_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      N8N_BASE_URL: http://n8n:5678
      N8N_API_KEY_FILE: /shared/n8n-api-key
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-ai_data_db}
      DB_USER: ${DB_USER:-ai_platform}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PLATFORM_API_TOKEN: ${PLATFORM_API_TOKEN:?Set PLATFORM_API_TOKEN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TIMEOUT_LLM_MS: ${TIMEOUT_LLM_MS:-120000}
      TIMEOUT_N8N_MS: ${TIMEOUT_N8N_MS:-120000}
      LIMIT_MAX_RECORDS: ${LIMIT_MAX_RECORDS:-1000000}
      LIMIT_MAX_EXPORT_SIZE_MB: ${LIMIT_MAX_EXPORT_SIZE_MB:-500}
    volumes:
      - shared_env:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      n8n-bootstrapper:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - '${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-80}:8080'
    depends_on:
      platform:
        condition: service_healthy
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
  n8n_data:
  shared_env:
